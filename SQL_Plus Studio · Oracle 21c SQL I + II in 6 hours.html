html {
  scroll-behavior: smooth;
  scroll-padding-top: 24px;
}
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  transition: background .4s, color .4s;
  overflow-x: hidden;
}
::selection {
  background: rgb(var(--violet-rgb) / .25);
}
a {
  color: var(--c-violet);

}

}
:focus-visible {

  border-radius: 6px;
}
.skip-link {
  position: absolute;
  left: -999px;
  top: 8px;
  z-index: 100;
  background: var(--ink);
  color: var(--bg);
  padding: 8px 14px;
  border-radius: 10px;
}
.skip-link:focus {
  left: 12px;
}

  position: fixed;
  inset: 0;
  z-index: -2;
  pointer-events: none;
  overflow: hidden;
}

  position: absolute;
  border-radius: 50%;
  filter: blur(70px);
  will-change: transform;
}
.ambient .b1 {
  width: 46vw;
  height: 46vw;
  left: -10vw;
  top: -12vw;
  background: var(--blob-1);
}
.ambient .b2 {
  width: 42vw;
  height: 42vw;
  right: -12vw;
  top: 20vh;
  background: var(--blob-2);
}
.ambient .b3 {
  width: 36vw;
  height: 36vw;
  left: 30vw;
  bottom: -18vw;
  background: var(--blob-3);
}
.grid-bg {
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  opacity: .5;
  background-image: linear-gradient(rgb(var(--ink-rgb) / .04) 1px, transparent 1px), linear-gradient(90deg, rgb(var(--ink-rgb) / .04) 1px, transparent 1px);
  background-size: 44px 44px;
  mask-image: radial-gradient(ellipse at 50% 0%, black 30%, transparent 75%);
}

  position: fixed;

  top: 0;
  width: 520px;
  height: 520px;
  margin: -260px 0 0 -260px;
  border-radius: 50%;
  pointer-events: none;
  z-index: -1;
  background: radial-gradient(circle, var(--glow), transparent 65%);
  transform: translate3d(var(--mx, -999px), var(--my, -999px), 0);
  transition: opacity .3s;
}
.scroll-bar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  z-index: 60;
  transform-origin: 0 50%;
  transform: scaleX(var(--sp, 0));
  background: var(--grad);
}
.side {
  position: fixed;
  inset: 0 auto 0 0;
  width: var(--side-w);
  z-index: 40;
  display: flex;
  flex-direction: column;
  background: var(--glass);
  backdrop-filter: blur(18px) saturate(1.4);
  border-right: 1px solid var(--line);
  transition: transform .35s cubic-bezier(.2,.8,.2,1);
}
.side-head {
  padding: 22px 20px 14px;
  display: flex;
  gap: 12px;
  align-items: center;
}
.logo {
  width: 42px;
  height: 42px;
  border-radius: 13px;
  background: var(--grad);
  display: grid;
  place-items: center;
  color: #fff;
  font: 700 15px var(--font-mono);
  box-shadow: 0 10px 24px -10px rgb(var(--violet-rgb) / .8);
  flex: none;
}
.side-title {
  font: 700 16px/1.15 var(--font-display);
  letter-spacing: -.01em;
}
.side-sub {
  font-size: 12px;
  color: var(--mute);
}
.side-prog {
  margin: 4px 20px 10px;
  padding: 12px 14px;
  border-radius: 14px;
  background: var(--card);
  border: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 12px;
}
.ring {
  --v: 0;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  flex: none;
  display: grid;
  place-items: center;
  font: 700 11px var(--font-mono);
  background: radial-gradient(closest-side, var(--card) 76%, transparent 78% 100%), conic-gradient(var(--c-violet) calc(var(--v) * 1%), var(--line) 0);
}
.side-nav {
  flex: 1;
  overflow-y: auto;
  padding: 4px 12px 16px;
  scrollbar-width: thin;
}
.part-label {
  margin: 16px 10px 6px;
  font: 600 11px var(--font-mono);
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--mute);
  display: flex;
  align-items: center;
  gap: 8px;
}
.part-label::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--line);
}
.nav-item {
  display: grid;
  grid-template-columns: 46px 1fr auto;
  gap: 8px;
  align-items: center;
  padding: 8px 10px;
  border-radius: 12px;
  color: var(--ink-2);
  text-decoration: none;
  font-size: 14px;
  line-height: 1.3;
  position: relative;
  transition: background .2s, color .2s;
}
.nav-item:hover {
  background: rgb(var(--violet-rgb) / .07);
  color: var(--ink);
}
.nav-item .t {
  font: 500 11px var(--font-mono);
  color: var(--mute);
}
.nav-item.active {
  background: var(--card);
  color: var(--ink);
  box-shadow: var(--shadow);
}
.nav-item.active::before {
  content: "";
  position: absolute;
  left: -12px;
  top: 10px;
  bottom: 10px;
  width: 4px;
  border-radius: 4px;
  background: var(--grad);
}
.nav-item .dots {
  display: flex;
  gap: 3px;
}
.nav-item .dots i {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--line-2);
}
.nav-item .dots i.on {
  background: var(--c-teal);
}
.side-foot {
  border-top: 1px solid var(--line);
  padding: 12px 14px 16px;
  display: grid;
  gap: 10px;
}

  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 12px;
  background: var(--t-bg);
  color: var(--t-ink);
  font: 500 12px var(--font-mono);
  border: 1px solid var(--t-line);

  text-align: left;
  width: 100%;
}

  height: 8px;
  border-radius: 50%;
  background: var(--t-dim);
  box-shadow: 0 0 0 3px rgb(140 136 170 / .2);
  flex: none;
}

  background: var(--t-ok);
  box-shadow: 0 0 0 3px rgb(91 227 168 / .2), 0 0 12px var(--t-ok);
  animation: pulse 2s infinite;
}
.conn small {
  display: block;
  color: var(--t-dim);
  font-size: 10.5px;
}

  display: flex;
  gap: 8px;
}

  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 50;
}

  display: none !important;
}

  list-style: disc;
  padding-left: 20px;
  margin: 6px 0 0;
}

  display: none;
}

    inset: 0;

  }

.btn {

  align-items: center;
  justify-content: center;

  box-shadow: var(--shadow-lg);
}
.ex.done {
  background: linear-gradient(135deg, rgb(var(--teal-rgb) / .8), rgb(var(--sky-rgb) / .5));
}
.ex-in {

  background: var(--card);
  padding: 22px clamp(16px, 2.5vw, 26px) 20px;
}
.ex-top {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 8px;
}
.ex-badge {
  font: 700 11.5px var(--font-mono);
  letter-spacing: .08em;
  color: #fff;
  background: var(--grad);
  padding: 4px 10px;
  border-radius: 8px;
}
.ex.done .ex-badge {
  background: var(--grad-cool);
}
.ex h4 {
  font: 750 20px/1.2 var(--font-display);
  letter-spacing: -.01em;
  flex: 1 1 260px;
}
.ex-task {
  color: var(--ink-2);
  font-size: 15.5px;
}
.ex-task ol {
  list-style: decimal;
  padding-left: 22px;
  margin: 6px 0;
  display: grid;
  gap: 4px;
}
.ex-task ol li::marker {
  color: var(--c-violet);
  font-weight: 700;
  font-family: var(--font-mono);
}
.ex-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 14px;
}
.hint {
  margin-top: 10px;
  padding: 10px 14px;
  border-radius: 12px;
  background: rgb(var(--amber-rgb) / .08);
  border: 1px solid rgb(var(--amber-rgb) / .28);
  font-size: 14.5px;
  color: var(--ink-2);
}
.hint b {
  color: var(--c-amber);
}
.solution {
  margin-top: 14px;
  border-radius: 16px;
  overflow: hidden;
  border: 1px solid var(--t-line);
  animation: unfold .45s cubic-bezier(.2,.8,.2,1);
}
.solution .code {
  margin: 0;
  border: 0;
  border-radius: 0;
  box-shadow: none;
}
.sol-why {
  padding: 12px 16px;
  font-size: 14.5px;
  background: var(--card-2);
  color: var(--ink-2);
  border-top: 1px solid var(--line);
}
.sol-why b {
  color: var(--ink);
}
.verdict {
  margin-top: 12px;
  display: flex;
  gap: 10px;
  align-items: flex-start;
  padding: 11px 14px;
  border-radius: 12px;
  font-size: 14.5px;
  animation: unfold .35s ease;
}
.verdict.ok {
  background: rgb(var(--teal-rgb) / .1);
  border: 1px solid rgb(var(--teal-rgb) / .35);
  color: var(--ink);
}
.verdict.no {
  background: rgb(var(--coral-rgb) / .08);
  border: 1px solid rgb(var(--coral-rgb) / .3);
  color: var(--ink);
}
.verdict .vi {
  flex: none;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: #fff;
  font-size: 12px;
  font-weight: 800;
}
.verdict.ok .vi {
  background: var(--c-teal);
}
.verdict.no .vi {
  background: var(--c-coral);
}
.confetti {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  border-radius: 22px;
}
.confetti i {
  position: absolute;
  top: 40%;
  left: 50%;
  width: 8px;
  height: 12px;
  border-radius: 2px;
  animation: burst 1s cubic-bezier(.2,.7,.3,1) forwards;
}
.term {
  margin-top: 16px;
  border-radius: 16px;
  overflow: hidden;
  background: var(--t-bg);
  border: 1px solid var(--t-line);
  color: var(--t-ink);
  font-family: var(--font-mono);
  font-size: 13.2px;
  line-height: 1.5;
  box-shadow: 0 20px 50px -28px rgb(0 0 0 / .9);
  position: relative;
}
.term::before {
  content: "";
  position: absolute;
  inset: 0 0 auto 0;
  height: 1px;
  background: var(--grad);
  opacity: .8;
}
.term-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px 8px 12px;
  background: var(--t-bg-2);
  border-bottom: 1px solid var(--t-line);
  font-size: 11.5px;
  color: var(--t-dim);
}
.term-bar .dots {
  display: flex;
  gap: 6px;
}
.term-bar .dots i {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #FF5F57;
}
.term-bar .dots i:nth-child(2) {
  background: #FEBC2E;
}
.term-bar .dots i:nth-child(3) {
  background: #28C840;
}
.term-bar .ttl {
  flex: 1;
  text-align: center;
  letter-spacing: .04em;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.term-bar .who {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 2px 8px;
  border-radius: 6px;
  background: rgb(255 255 255 / .05);
  color: var(--t-ink);
  white-space: nowrap;
}
.term-bar .who i {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--t-dim);
}
.term-bar .who i.on {
  background: var(--t-ok);
  box-shadow: 0 0 8px var(--t-ok);
}
.term-bar button {
  background: transparent;
  border: 1px solid var(--t-line);
  color: var(--t-dim);
  border-radius: 6px;
  height: 24px;
  padding: 0 8px;
  font: 600 11px var(--font-mono);
  cursor: pointer;
}
.term-bar button:hover {
  color: var(--t-ink);
  border-color: var(--tk-kw);
}
.term-out {
  max-height: 380px;
  min-height: 120px;
  overflow: auto;
  padding: 12px 14px 4px;
  scrollbar-width: thin;
  scrollbar-color: var(--t-line) transparent;
}
.term.tall .term-out {
  max-height: 58vh;
  min-height: 280px;
}
.term-out pre {
  margin: 0;
  white-space: pre;
  font: inherit;
}
.tl {
  white-space: pre;
  min-height: 1.5em;
}
.tl.err {
  color: var(--t-err);
}
.tl.ok {
  color: var(--t-ok);
}
.tl.hint {
  color: var(--t-hint);
  white-space: pre-wrap;
  padding-left: 2ch;
  text-indent: -2ch;
}
.tl.dim {
  color: var(--t-dim);
  white-space: pre-wrap;
}
.tl.head {
  color: var(--t-head);
}
.tl.warn {
  color: var(--t-warn);
  white-space: pre-wrap;
}
.tl.echo {
  color: var(--t-ink);
}
.term .tl.hint {
  margin: 0;
  padding: 0 0 0 2ch;
  background: none;
  border: 0;
  border-radius: 0;
  font-size: inherit;
}
.tl.echo .p {
  color: var(--t-prompt);
  font-weight: 700;
}
.welcome {
  color: var(--t-dim);
  white-space: pre-wrap;
}
.welcome b {
  color: var(--t-hint);
  font-weight: 600;
}
.term-in {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 0 1ch;
  padding: 4px 14px 12px;
  align-items: start;
}
.term-in .p {
  color: var(--t-prompt);
  font-weight: 700;
  line-height: 1.5;
  white-space: pre;
}
.edit {
  position: relative;
}
.edit pre, .edit textarea {
  margin: 0;
  padding: 0;
  border: 0;
  font: inherit;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
  overflow-wrap: anywhere;
  letter-spacing: 0;
  tab-size: 2;
}
.edit pre {
  pointer-events: none;
  color: var(--t-ink);
  min-height: 1.5em;
}
.edit textarea {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  resize: none;
  background: transparent;
  color: transparent;
  caret-color: var(--t-prompt);
  outline: none;
  overflow: hidden;
}
.edit textarea::selection {
  background: var(--t-sel);
  color: transparent;
}
.edit .ph {
  position: absolute;
  left: 0;
  top: 0;
  color: rgb(140 136 170 / .55);
  pointer-events: none;
}
.term-foot {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
  padding: 6px 14px 10px;
  font-size: 10.5px;
  color: var(--t-dim);
  border-top: 1px dashed var(--t-line);
}
.term-foot kbd {
  padding: 0 5px;
  border: 1px solid var(--t-line);
  border-radius: 4px;
  font-size: 10px;
}
.lob-strip {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  padding: 8px 0 10px;
}
.lob {
  display: grid;
  grid-template-columns: 52px auto;
  gap: 10px;
  align-items: center;
  padding: 6px 10px 6px 6px;
  border: 1px solid var(--t-line);
  border-radius: 12px;
  background: rgb(255 255 255 / .03);
  font-size: 11px;
  color: var(--t-dim);
  animation: unfold .4s ease;
}
.lob img {
  width: 52px;
  height: 52px;
  object-fit: cover;
  border-radius: 8px;
  background: #222;
}
.lob b {
  display: block;
  color: var(--t-ink);
  font-weight: 600;
}
.types {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 12px;
  margin: 16px 0;
}
.type {
  padding: 16px;
  border-radius: 16px;
  background: var(--card);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
}
.type::after {
  content: "";
  position: absolute;
  right: -30px;
  top: -30px;
  width: 90px;
  height: 90px;
  border-radius: 50%;
  background: var(--grad-soft);
}
.type .tn {
  font: 700 15px var(--font-mono);
  color: var(--c-violet);
}
.type .tx {
  font-size: 13.5px;
  color: var(--ink-2);
  margin-top: 4px;
}
.type .te {
  margin-top: 8px;
  font: 500 12px var(--font-mono);
  color: var(--ink);
  background: var(--code-bg);
  border-radius: 8px;
  padding: 6px 8px;
  overflow-wrap: anywhere;
}
.type.blob {
  border-color: rgb(var(--coral-rgb) / .4);
}
.type.blob .tn {
  color: var(--c-coral);
}
.files {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 12px;
  margin: 12px 0;
}
.file {
  border-radius: 14px;
  background: var(--card);
  border: 1px solid var(--line);
  padding: 8px;
  font-size: 12px;
  text-align: center;
  box-shadow: var(--shadow);
  transition: transform .25s;
}
.file:hover {
  transform: translateY(-4px) rotate(-1deg);
}
.file img {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  border-radius: 10px;
  display: block;
  margin-bottom: 6px;
}
.file b {
  font-family: var(--font-mono);
  font-size: 12px;
  display: block;
  overflow-wrap: anywhere;
}
.file span {
  color: var(--mute);
  font-size: 11px;
}
.file.add {
  display: grid;
  place-items: center;
  border-style: dashed;
  cursor: pointer;
  color: var(--c-violet);
  min-height: 150px;
  background: var(--card-2);
}
.file.add:hover {
  border-color: var(--c-violet);
}
.path {
  font: 600 12px var(--font-mono);
  color: var(--mute);
  display: flex;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
}
.drawer {
  position: fixed;
  inset: 0 0 0 auto;
  width: min(720px, 100vw);
  z-index: 70;
  background: var(--bg);
  border-left: 1px solid var(--line);
  box-shadow: var(--shadow-lg);
  transform: translateX(104%);
  transition: transform .4s cubic-bezier(.2,.8,.2,1);
  display: flex;
  flex-direction: column;
}
.drawer.open {
  transform: none;
}
.drawer-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 16px 20px;
  border-bottom: 1px solid var(--line);
}
.drawer-head h3 {
  font: 750 20px var(--font-display);
  flex: 1;
}
.drawer-body {
  overflow-y: auto;
  padding: 8px 20px 30px;
}
.drawer-scrim {
  position: fixed;
  inset: 0;
  z-index: 65;
  background: rgb(0 0 0 / .3);
  backdrop-filter: blur(3px);
  opacity: 0;
  pointer-events: none;
  transition: opacity .3s;
}
.drawer-scrim.open {
  opacity: 1;
  pointer-events: auto;
}
.tabs {
  display: flex;
  gap: 6px;
  padding: 4px;
  border-radius: 12px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  width: max-content;
  max-width: 100%;
  overflow-x: auto;
  margin: 14px 0;
}
.tabs button {
  border: 0;
  background: transparent;
  padding: 7px 12px;
  border-radius: 9px;
  font: 600 13px var(--font-body);
  color: var(--ink-2);
  cursor: pointer;
  white-space: nowrap;
}
.tabs button.on {
  background: var(--card);
  color: var(--ink);
  box-shadow: var(--shadow);
}
.kv {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 10px;
  margin: 10px 0;
}
.kv div {
  padding: 10px 12px;
  border-radius: 12px;
  background: var(--card);
  border: 1px solid var(--line);
  font-size: 12.5px;
  color: var(--mute);
}
.kv b {
  display: block;
  font: 700 15px var(--font-mono);
  color: var(--ink);
  overflow-wrap: anywhere;
}
.dict-layers {
  display: grid;
  gap: 10px;
  margin: 16px 0;
}
.dl {
  display: grid;
  grid-template-columns: 110px 1fr;
  gap: 14px;
  align-items: center;
  padding: 12px 16px;
  border-radius: 14px;
  background: var(--card);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  transition: transform .25s;
}
.dl:hover {
  transform: translateX(6px);
}
.dl b {
  font: 800 16px var(--font-mono);
}
.dl p {
  font-size: 14px;
  color: var(--ink-2);
  margin: 0;
}
.dl:nth-child(1) b {
  color: var(--c-teal);
}
.dl:nth-child(2) b {
  color: var(--c-sky);
}
.dl:nth-child(3) b {
  color: var(--c-violet);
}
.dl:nth-child(4) b {
  color: var(--c-coral);
}
.dl:nth-child(5) b {
  color: var(--c-amber);
}
.timeline {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 4px;
  margin: 20px 0 6px;
}
.timeline div {
  height: 34px;
  border-radius: 8px;
  display: grid;
  place-items: center;
  font: 600 10.5px var(--font-mono);
  color: #fff;
  overflow: hidden;
  white-space: nowrap;
}
.tl-legend {
  display: flex;
  justify-content: space-between;
  font: 500 11px var(--font-mono);
  color: var(--mute);
}
footer.foot {
  padding: 70px 0 50px;
  text-align: center;
  color: var(--mute);
  font-size: 14px;
}
footer.foot .big {
  font: 800 clamp(34px, 5vw, 60px)/1 var(--font-display);
  color: var(--ink);
  letter-spacing: -.03em;
  margin-bottom: 12px;
}
.sa {
  opacity: 0;
  transform: translateY(26px) scale(.985);
  transition: opacity .8s cubic-bezier(.2,.8,.2,1), transform .8s cubic-bezier(.2,.8,.2,1);
  transition-delay: var(--d, 0ms);
}
.sa.in {
  opacity: 1;
  transform: none;
}
.sa-left {
  opacity: 0;
  transform: translateX(-40px);
  transition: opacity .9s, transform .9s cubic-bezier(.2,.8,.2,1);
}
.sa-left.in {
  opacity: 1;
  transform: none;
}
svg.draw {
  clip-path: inset(0 100% 0 0);
  transition: clip-path 1.3s cubic-bezier(.6,0,.2,1) .1s;
}
svg.draw.in, .in svg.draw {
  clip-path: inset(0 0 0 0);
}
.flow {
  stroke-dasharray: 6 6;
  animation: flow 1.2s linear infinite;
}
.float {
  animation: float 6s ease-in-out infinite;
}
.spin-slow {
  animation: spin 30s linear infinite;
  transform-origin: center;
  transform-box: fill-box;
}
.pulse-dot {
  animation: pulse 2s infinite;
  transform-origin: center;
  transform-box: fill-box;
}
@keyframes rise {
  from {
    transform: translateY(105%);
  }
  to {
    transform: none;
  }
}
@keyframes pulse {
  0%, 100% {
    opacity: 1;
  }
  50% {
    opacity: .45;
  }
}
@keyframes wheel {
  0% {
    opacity: 0;
    transform: translateY(0);
  }
  30% {
    opacity: 1;
  }
  100% {
    opacity: 0;
    transform: translateY(12px);
  }
}
@keyframes bob {
  0%, 100% {
    margin-top: -14px;
  }
  50% {
    margin-top: -24px;
  }
}
@keyframes unfold {
  from {
    opacity: 0;
    transform: translateY(-6px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes drawIn {
  to {
    stroke-dashoffset: 0;
  }
}
@keyframes flow {
  to {
    stroke-dashoffset: -24;
  }
}
@keyframes float {
  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-10px);
  }
}
@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
@keyframes burst {
  0% {
    transform: translate(0, 0) rotate(0);
    opacity: 1;
  }
  100% {
    transform: translate(var(--bx), var(--by)) rotate(var(--br));
    opacity: 0;
  }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
  .sa, .sa-left {
    opacity: 1;
    transform: none;
  }
  svg.draw {
    clip-path: none;
  }
}
@media print {
  .side, .burger, .term, .ambient, .grid-bg, .cursor-glow, .scroll-bar, .hero-canvas {
    display: none !important;
  }
  .main {
    margin: 0;
  }
  .sa {
    opacity: 1;
    transform: none;
  }
}
