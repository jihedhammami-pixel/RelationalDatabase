  right: -12vw;
  top: 20vh;

.ex {
  position: relative;
  margin: 22px 0 34px;
  border-radius: 22px;
  padding: 1.5px;
  background: linear-gradient(135deg, rgb(var(--violet-rgb) / .5), rgb(var(--coral-rgb) / .3) 40%, rgb(var(--sky-rgb) / .4));
  box-shadow: var(--shadow-lg);
}
.ex.done {
  background: linear-gradient(135deg, rgb(var(--teal-rgb) / .8), rgb(var(--sky-rgb) / .5));
}
.ex-in {
  border-radius: 21px;
  background: var(--card);
  padding: 22px clamp(16px, 2.5vw, 26px) 20px;
}
.ex-top {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 8px;
}
.ex-badge {
  font: 700 11.5px var(--font-mono);
  letter-spacing: .08em;
  color: #fff;
  background: var(--grad);
  padding: 4px 10px;
  border-radius: 8px;
}
.ex.done .ex-badge {
  background: var(--grad-cool);
}
.ex h4 {
  font: 750 20px/1.2 var(--font-display);
  letter-spacing: -.01em;
  flex: 1 1 260px;
}
.ex-task {
  color: var(--ink-2);
  font-size: 15.5px;
}
.ex-task ol {
  list-style: decimal;
  padding-left: 22px;
  margin: 6px 0;
  display: grid;
  gap: 4px;
}
.ex-task ol li::marker {
  color: var(--c-violet);
  font-weight: 700;
  font-family: var(--font-mono);
}
.ex-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 14px;
}
.hint {
  margin-top: 10px;
  padding: 10px 14px;
  border-radius: 12px;
  background: rgb(var(--amber-rgb) / .08);
  border: 1px solid rgb(var(--amber-rgb) / .28);
  font-size: 14.5px;
  color: var(--ink-2);
}
.hint b {
  color: var(--c-amber);
}
.solution {
  margin-top: 14px;
  border-radius: 16px;
  overflow: hidden;
  border: 1px solid var(--t-line);
  animation: unfold .45s cubic-bezier(.2,.8,.2,1);
}
.solution .code {
  margin: 0;
  border: 0;
  border-radius: 0;
  box-shadow: none;
}
.sol-why {
  padding: 12px 16px;
  font-size: 14.5px;
  background: var(--card-2);
  color: var(--ink-2);
  border-top: 1px solid var(--line);
}
.sol-why b {
  color: var(--ink);
}
.verdict {
  margin-top: 12px;
  display: flex;
  gap: 10px;
  align-items: flex-start;
  padding: 11px 14px;
  border-radius: 12px;
  font-size: 14.5px;
  animation: unfold .35s ease;
}
.verdict.ok {
  background: rgb(var(--teal-rgb) / .1);
  border: 1px solid rgb(var(--teal-rgb) / .35);
  color: var(--ink);
}
.verdict.no {
  background: rgb(var(--coral-rgb) / .08);
  border: 1px solid rgb(var(--coral-rgb) / .3);
  color: var(--ink);
}
.verdict .vi {
  flex: none;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: #fff;
  font-size: 12px;
  font-weight: 800;
}
.verdict.ok .vi {
  background: var(--c-teal);
}
.verdict.no .vi {
  background: var(--c-coral);
}
.confetti {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  border-radius: 22px;
}
.confetti i {
  position: absolute;
  top: 40%;
  left: 50%;
  width: 8px;
  height: 12px;
  border-radius: 2px;
  animation: burst 1s cubic-bezier(.2,.7,.3,1) forwards;
}
.term {
  margin-top: 16px;
  border-radius: 16px;
  overflow: hidden;
  background: var(--t-bg);
  border: 1px solid var(--t-line);
  color: var(--t-ink);
  font-family: var(--font-mono);
  font-size: 13.2px;
  line-height: 1.5;
  box-shadow: 0 20px 50px -28px rgb(0 0 0 / .9);
  position: relative;
}
.term::before {
  content: "";
  position: absolute;
  inset: 0 0 auto 0;
  height: 1px;
  background: var(--grad);
  opacity: .8;
}
.term-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px 8px 12px;
  background: var(--t-bg-2);
  border-bottom: 1px solid var(--t-line);
  font-size: 11.5px;
  color: var(--t-dim);
}
.term-bar .dots {
  display: flex;
  gap: 6px;
}
.term-bar .dots i {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #FF5F57;
}
.term-bar .dots i:nth-child(2) {
  background: #FEBC2E;
}
.term-bar .dots i:nth-child(3) {
  background: #28C840;
}
.term-bar .ttl {
  flex: 1;
  text-align: center;
  letter-spacing: .04em;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.term-bar .who {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 2px 8px;
  border-radius: 6px;
  background: rgb(255 255 255 / .05);
  color: var(--t-ink);
  white-space: nowrap;
}
.term-bar .who i {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--t-dim);
}
.term-bar .who i.on {
  background: var(--t-ok);
  box-shadow: 0 0 8px var(--t-ok);
}
.term-bar button {
  background: transparent;
  border: 1px solid var(--t-line);
  color: var(--t-dim);
  border-radius: 6px;
  height: 24px;
  padding: 0 8px;
  font: 600 11px var(--font-mono);
  cursor: pointer;
}
.term-bar button:hover {
  color: var(--t-ink);
  border-color: var(--tk-kw);
}
.term-out {
  max-height: 380px;
  min-height: 120px;
  overflow: auto;
  padding: 12px 14px 4px;
  scrollbar-width: thin;
  scrollbar-color: var(--t-line) transparent;
}
.term.tall .term-out {
  max-height: 58vh;
  min-height: 280px;
}
.term-out pre {
  margin: 0;
  white-space: pre;
  font: inherit;
}
.tl {
  white-space: pre;
  min-height: 1.5em;
}
.tl.err {
  color: var(--t-err);
}
.tl.ok {
  color: var(--t-ok);
}
.tl.hint {
  color: var(--t-hint);
  white-space: pre-wrap;
  padding-left: 2ch;
  text-indent: -2ch;
}
.tl.dim {
  color: var(--t-dim);
  white-space: pre-wrap;
}
.tl.head {
  color: var(--t-head);
}
.tl.warn {
  color: var(--t-warn);
  white-space: pre-wrap;
}
.tl.echo {
  color: var(--t-ink);
}
.term .tl.hint {
  margin: 0;
  padding: 0 0 0 2ch;
  background: none;
  border: 0;
  border-radius: 0;
  font-size: inherit;
}
.tl.echo .p {
  color: var(--t-prompt);
  font-weight: 700;
}
.welcome {
  color: var(--t-dim);
  white-space: pre-wrap;
}
.welcome b {
  color: var(--t-hint);
  font-weight: 600;
}
.term-in {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 0 1ch;
  padding: 4px 14px 12px;
  align-items: start;
}
.term-in .p {
  color: var(--t-prompt);
  font-weight: 700;
  line-height: 1.5;
  white-space: pre;
}
.edit {
  position: relative;
}
.edit pre, .edit textarea {
  margin: 0;
  padding: 0;
  border: 0;
  font: inherit;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
  overflow-wrap: anywhere;
  letter-spacing: 0;
  tab-size: 2;
}
.edit pre {
  pointer-events: none;
  color: var(--t-ink);
  min-height: 1.5em;
}
.edit textarea {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  resize: none;
  background: transparent;
  color: transparent;
  caret-color: var(--t-prompt);
  outline: none;
  overflow: hidden;
}
.edit textarea::selection {
  background: var(--t-sel);
  color: transparent;
}
.edit .ph {
  position: absolute;
  left: 0;
  top: 0;
  color: rgb(140 136 170 / .55);
  pointer-events: none;
}
.term-foot {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
  padding: 6px 14px 10px;
  font-size: 10.5px;
  color: var(--t-dim);
  border-top: 1px dashed var(--t-line);
}
.term-foot kbd {
  padding: 0 5px;
  border: 1px solid var(--t-line);
  border-radius: 4px;
  font-size: 10px;
}
.lob-strip {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  padding: 8px 0 10px;
}
.lob {
  display: grid;
  grid-template-columns: 52px auto;
  gap: 10px;
  align-items: center;
  padding: 6px 10px 6px 6px;
  border: 1px solid var(--t-line);
  border-radius: 12px;
  background: rgb(255 255 255 / .03);
  font-size: 11px;
  color: var(--t-dim);
  animation: unfold .4s ease;
}
.lob img {
  width: 52px;
  height: 52px;
  object-fit: cover;
  border-radius: 8px;
  background: #222;
}
.lob b {
  display: block;
  color: var(--t-ink);
  font-weight: 600;
}
.types {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 12px;
  margin: 16px 0;
}
.type {
  padding: 16px;
  border-radius: 16px;
  background: var(--card);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
}
.type::after {
  content: "";
  position: absolute;
  right: -30px;
  top: -30px;
  width: 90px;
  height: 90px;
  border-radius: 50%;
  background: var(--grad-soft);
}
.type .tn {
  font: 700 15px var(--font-mono);
  color: var(--c-violet);
}
.type .tx {
  font-size: 13.5px;
  color: var(--ink-2);
  margin-top: 4px;
}
.type .te {
  margin-top: 8px;
  font: 500 12px var(--font-mono);
  color: var(--ink);
  background: var(--code-bg);
  border-radius: 8px;
  padding: 6px 8px;
  overflow-wrap: anywhere;
}
.type.blob {
  border-color: rgb(var(--coral-rgb) / .4);
}
.type.blob .tn {
  color: var(--c-coral);
}
.files {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 12px;
  margin: 12px 0;
}
.file {
  border-radius: 14px;
  background: var(--card);
  border: 1px solid var(--line);
  padding: 8px;
  font-size: 12px;
  text-align: center;
  box-shadow: var(--shadow);
  transition: transform .25s;
}
.file:hover {
  transform: translateY(-4px) rotate(-1deg);
}
.file img {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  border-radius: 10px;
  display: block;
  margin-bottom: 6px;
}
.file b {
  font-family: var(--font-mono);
  font-size: 12px;
  display: block;
  overflow-wrap: anywhere;
}
.file span {
  color: var(--mute);
  font-size: 11px;
}
.file.add {
  display: grid;
  place-items: center;
  border-style: dashed;
  cursor: pointer;
  color: var(--c-violet);
  min-height: 150px;
  background: var(--card-2);
}
.file.add:hover {
  border-color: var(--c-violet);
}
.path {
  font: 600 12px var(--font-mono);
  color: var(--mute);
  display: flex;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
}
.drawer {
  position: fixed;
  inset: 0 0 0 auto;
  width: min(720px, 100vw);
  z-index: 70;
  background: var(--bg);
  border-left: 1px solid var(--line);
  box-shadow: var(--shadow-lg);
  transform: translateX(104%);
  transition: transform .4s cubic-bezier(.2,.8,.2,1);
  display: flex;
  flex-direction: column;
}
.drawer.open {
  transform: none;
}
.drawer-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 16px 20px;
  border-bottom: 1px solid var(--line);
}
.drawer-head h3 {
  font: 750 20px var(--font-display);
  flex: 1;
}
.drawer-body {
  overflow-y: auto;
  padding: 8px 20px 30px;
}
.drawer-scrim {
  position: fixed;
  inset: 0;
  z-index: 65;
  background: rgb(0 0 0 / .3);
  backdrop-filter: blur(3px);
  opacity: 0;
  pointer-events: none;
  transition: opacity .3s;
}
.drawer-scrim.open {
  opacity: 1;
  pointer-events: auto;
}
.tabs {
  display: flex;
  gap: 6px;
  padding: 4px;
  border-radius: 12px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  width: max-content;
  max-width: 100%;
  overflow-x: auto;
  margin: 14px 0;
}
.tabs button {
  border: 0;
  background: transparent;
  padding: 7px 12px;
  border-radius: 9px;
  font: 600 13px var(--font-body);
  color: var(--ink-2);
  cursor: pointer;
  white-space: nowrap;
}
.tabs button.on {
  background: var(--card);
  color: var(--ink);
  box-shadow: var(--shadow);
}
.kv {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 10px;
  margin: 10px 0;
}
.kv div {
  padding: 10px 12px;
  border-radius: 12px;
  background: var(--card);
  border: 1px solid var(--line);
  font-size: 12.5px;
  color: var(--mute);
}
.kv b {
  display: block;
  font: 700 15px var(--font-mono);
  color: var(--ink);
  overflow-wrap: anywhere;
}
.dict-layers {
  display: grid;
  gap: 10px;
  margin: 16px 0;
}
.dl {
  display: grid;
  grid-template-columns: 110px 1fr;
  gap: 14px;
  align-items: center;
  padding: 12px 16px;
  border-radius: 14px;
  background: var(--card);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  transition: transform .25s;
}
.dl:hover {
  transform: translateX(6px);
}
.dl b {
  font: 800 16px var(--font-mono);
}
.dl p {
  font-size: 14px;
  color: var(--ink-2);
  margin: 0;
}
.dl:nth-child(1) b {
  color: var(--c-teal);
}
.dl:nth-child(2) b {
  color: var(--c-sky);
}
.dl:nth-child(3) b {
  color: var(--c-violet);
}
.dl:nth-child(4) b {
  color: var(--c-coral);
}
.dl:nth-child(5) b {
  color: var(--c-amber);
}
.timeline {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 4px;
  margin: 20px 0 6px;
}
.timeline div {
  height: 34px;
  border-radius: 8px;
  display: grid;
  place-items: center;
  font: 600 10.5px var(--font-mono);
  color: #fff;
  overflow: hidden;
  white-space: nowrap;
}
.tl-legend {
  display: flex;
  justify-content: space-between;
  font: 500 11px var(--font-mono);
  color: var(--mute);
}
footer.foot {
  padding: 70px 0 50px;
  text-align: center;
  color: var(--mute);
  font-size: 14px;
}
footer.foot .big {
  font: 800 clamp(34px, 5vw, 60px)/1 var(--font-display);
  color: var(--ink);
  letter-spacing: -.03em;
  margin-bottom: 12px;
}
.sa {
  opacity: 0;
  transform: translateY(26px) scale(.985);
  transition: opacity .8s cubic-bezier(.2,.8,.2,1), transform .8s cubic-bezier(.2,.8,.2,1);
  transition-delay: var(--d, 0ms);
}
.sa.in {
  opacity: 1;
  transform: none;
}
.sa-left {
  opacity: 0;
  transform: translateX(-40px);
  transition: opacity .9s, transform .9s cubic-bezier(.2,.8,.2,1);
}
.sa-left.in {
  opacity: 1;
  transform: none;
}
svg.draw {
  clip-path: inset(0 100% 0 0);
  transition: clip-path 1.3s cubic-bezier(.6,0,.2,1) .1s;
}
svg.draw.in, .in svg.draw {
  clip-path: inset(0 0 0 0);
}
.flow {
  stroke-dasharray: 6 6;
  animation: flow 1.2s linear infinite;
}
.float {
  animation: float 6s ease-in-out infinite;
}
.spin-slow {
  animation: spin 30s linear infinite;
  transform-origin: center;
  transform-box: fill-box;
}
.pulse-dot {
  animation: pulse 2s infinite;
  transform-origin: center;
  transform-box: fill-box;
}
@keyframes rise {
  from {
    transform: translateY(105%);
  }
  to {
    transform: none;
  }
}
@keyframes pulse {
  0%, 100% {
    opacity: 1;
  }
  50% {
    opacity: .45;
  }
}
@keyframes wheel {
  0% {
    opacity: 0;
    transform: translateY(0);
  }
  30% {
    opacity: 1;
  }
  100% {
    opacity: 0;
    transform: translateY(12px);
  }
}
@keyframes bob {
  0%, 100% {
    margin-top: -14px;
  }
  50% {
    margin-top: -24px;
  }
}
@keyframes unfold {
  from {
    opacity: 0;
    transform: translateY(-6px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes drawIn {
  to {
    stroke-dashoffset: 0;
  }
}
@keyframes flow {
  to {
    stroke-dashoffset: -24;
  }
}
@keyframes float {
  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-10px);
  }
}
@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
@keyframes burst {
  0% {
    transform: translate(0, 0) rotate(0);
    opacity: 1;
  }
  100% {
    transform: translate(var(--bx), var(--by)) rotate(var(--br));
    opacity: 0;
  }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
  .sa, .sa-left {
    opacity: 1;
    transform: none;
  }
  svg.draw {
    clip-path: none;
  }
}
@media print {
  .side, .burger, .term, .ambient, .grid-bg, .cursor-glow, .scroll-bar, .hero-canvas {
    display: none !important;
  }
  .main {
    margin: 0;
  }
  .sa {
    opacity: 1;
    transform: none;
  }
}

\xE9ma $2."],[/^(\S+) has no column named (\S+)\. Its columns are: (.*)\.$/,"$1 n'a pas de colonne nomm\xE9e $2. Ses colonnes sont : $3."],[/^(\S+) exists in (.+)\. Qualify it, e\.g\. (\S+)\.$/,"$1 existe dans $2. Pr\xE9fixez-la, par exemple $3."],[/^Write (\S+), not (\S+), when the join uses USING \((\S+)\)\.$/,"\xC9crivez $1, et non $2, quand la jointure utilise USING ($3)."],[/^USING \((.+)\) requires a column named (.+) on both sides of the join\.$/,"USING ($1) exige une colonne nomm\xE9e $2 des deux c\xF4t\xE9s de la jointure."],[/^The name (\S+) is used for two sources in FROM\. Give each one a different alias\.$/,"Le nom $1 d\xE9signe deux sources dans FROM. Donnez \xE0 chacune un alias diff\xE9rent."],[/^No sequence named (\S+)\.$/,"Aucune s\xE9quence nomm\xE9e $1."],[/^Call (\S+)\.NEXTVAL at least once in this session before reading CURRVAL\.$/,"Appelez $1.NEXTVAL au moins une fois dans cette session avant de lire CURRVAL."],[/^(\S+) already exists\. DROP it first or choose another name\.$/,"$1 existe d\xE9j\xE0. Supprimez-le d'abord (DROP) ou choisissez un autre nom."],[/^Constraint names are unique per schema; (\S+) is taken\.$/,"Les noms de contraintes sont uniques dans un sch\xE9ma ; $1 est d\xE9j\xE0 pris."],[/^The referenced table (\S+) does not exist\. Create the parent table first\.$/,"La table r\xE9f\xE9renc\xE9e $1 n'existe pas. Cr\xE9ez d'abord la table parente."],[/^(.+) is not a primary key or unique key\.$/,"$1 n'est ni une cl\xE9 primaire ni une cl\xE9 unique."],[/^Use CREATE OR REPLACE VIEW to redefine an existing view\.$/,"Utilisez CREATE OR REPLACE VIEW pour red\xE9finir une vue existante."],[/^Give "(.+)" an alias, e\.g\. (.+) AS some_name\.$/s,"Donnez un alias \xE0 \xAB $1 \xBB, par exemple $2 AS un_nom."],[/^Give "(.+)" an alias\.$/s,"Donnez un alias \xE0 \xAB $1 \xBB."],[/^Another row in (\S+) already has (.+) = (.+)\.$/,"Une autre ligne de $1 a d\xE9j\xE0 $2 = $3."],[/^(.+) = (.+) does not exist in (\S+)\.$/,"$1 = $2 n'existe pas dans );
